<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Distance to Angle Conversion</title>

  <style>
    :root {
      --blue: #1976d2;
      --blue-dark: #12305a;
      --border: #c5ccd6;
      --result-border: #9fc5ff;
      --bg: #f3f3f3;
      --text: #222;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 18px;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.16);
    }

    h1 {
      font-size: 30px;
      margin: 0 0 28px;
      text-align: center;
      color: var(--blue-dark);
      font-weight: 800;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 18px;
    }

    .field-block {
      min-width: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 19px;
      font-weight: 500;
      text-align: left;
    }

    input,
    .result-field {
      width: 100%;
      box-sizing: border-box;
      min-height: 58px;
      padding: 12px 14px;
      font-size: 23px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: white;
      color: #222;
      text-align: left;
    }

    input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(25,118,210,0.14);
    }

    .buttons {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .clear {
      padding: 9px 20px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      background: #f5f5f5;
      color: #222;
      border: 1px solid #c6c6c6;
    }

    .clear:active {
      transform: translateY(1px);
    }

    .error {
      margin-top: 18px;
      padding: 12px;
      background: #ffe5e5;
      color: #9b0000;
      border-radius: 10px;
      font-size: 17px;
      display: none;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 30px 0 14px;
      color: var(--blue);
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    .section-title::before,
    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #c8ced8;
    }

    .result-label {
      display: block;
      margin-top: 22px;
      margin-bottom: 8px;
      font-size: 20px;
      font-weight: 500;
      text-align: left;
    }

    .result-field {
      border-color: var(--result-border);
      background: #fbfdff;
      font-weight: bold;
      color: #1b1b1b;
    }

    .footer-banner {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid #d9d9d9;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: bold;
      color: var(--blue-dark);
      text-align: center;
      direction: rtl;
    }

    .cannon {
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .cannon svg {
      width: 42px;
      height: 42px;
      stroke: var(--blue-dark);
      fill: none;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (max-width: 420px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 20px;
        border-radius: 18px;
      }

      h1 {
        font-size: 25px;
      }

      .input-row {
        gap: 10px;
      }

      label {
        font-size: 16px;
      }

      input,
      .result-field {
        font-size: 20px;
        padding: 12px 10px;
      }

      .clear {
        font-size: 16px;
        padding: 8px 16px;
      }

      .footer-banner {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Distance to Angle Conversion</h1>

    <div class="input-row">
      <div class="field-block">
        <label for="radius">Radius [mm]</label>
        <input
          id="radius"
          type="number"
          value="100"
          step="0.001"
          inputmode="decimal"
          oninput="recalculate()"
        />
      </div>

      <div class="field-block">
        <label for="movement">Movement [mm]</label>
        <input
          id="movement"
          type="number"
          step="0.001"
          inputmode="decimal"
          oninput="useDirectMovement()"
        />
      </div>
    </div>

    <div class="input-row">
      <div class="field-block">
        <label for="reading1">Reading 1 [mm]</label>
        <input
          id="reading1"
          type="number"
          step="0.001"
          inputmode="decimal"
          oninput="useReadings()"
        />
      </div>

      <div class="field-block">
        <label for="reading2">Reading 2 [mm]</label>
        <input
          id="reading2"
          type="number"
          step="0.001"
          inputmode="decimal"
          oninput="useReadings()"
        />
      </div>
    </div>

    <div class="buttons">
      <button class="clear" onclick="clearFields()">Clear</button>
    </div>

    <div id="error" class="error"></div>

    <div class="section-title">Results</div>

    <div class="result-label">Angle [°]</div>
    <div id="degrees" class="result-field"></div>

    <div class="result-label">Angle [mrad]</div>
    <div id="mrad" class="result-field"></div>

    <div class="footer-banner">
      <span class="cannon" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <path d="M14 42h28" />
          <path d="M25 42l-8 10" />
          <path d="M42 42l8 10" />
          <circle cx="20" cy="52" r="6" />
          <circle cx="46" cy="52" r="6" />
          <path d="M28 26l24-8c3-1 6 1 7 4s-1 6-4 7l-24 8z" />
          <path d="M25 27l7 12" />
          <path d="M12 39c7-6 12-10 18-12" />
          <path d="M8 46c5-2 9-3 14-4" />
        </svg>
      </span>

      <span>תותחים יש רק באינטגרציה</span>
    </div>
  </div>

  <script>
    let updatingMovementFromReadings = false;

    function useDirectMovement() {
      // Prevent the automatic value written into Movement
      // from being treated as manual user input.
      if (updatingMovementFromReadings) {
        return;
      }

      const movementText = document.getElementById("movement").value;

      // If the user starts entering Movement manually,
      // clear both Reading fields.
      if (movementText !== "") {
        document.getElementById("reading1").value = "";
        document.getElementById("reading2").value = "";
      }

      recalculate();
    }

    function useReadings() {
      const reading1Text = document.getElementById("reading1").value;
      const reading2Text = document.getElementById("reading2").value;
      const movementField = document.getElementById("movement");

      // As soon as either Reading field is used,
      // clear the previous Movement value.
      if (reading1Text !== "" || reading2Text !== "") {
        movementField.value = "";
      }

      // If both readings exist, calculate the delta
      // and show it in Movement.
      if (reading1Text !== "" && reading2Text !== "") {
        const reading1 = Number(reading1Text);
        const reading2 = Number(reading2Text);

        if (!isNaN(reading1) && !isNaN(reading2)) {
          const movement = Math.abs(reading1 - reading2);

          updatingMovementFromReadings = true;
          movementField.value = formatMovement(movement);
          updatingMovementFromReadings = false;
        }
      }

      recalculate();
    }

    function recalculate() {
      const radiusText = document.getElementById("radius").value;
      const movementText = document.getElementById("movement").value;

      clearError();

      // Not enough information yet.
      if (radiusText === "" || movementText === "") {
        clearResults();
        return;
      }

      const radius = Number(radiusText);
      const movement = Number(movementText);

      if (isNaN(radius) || radius <= 0) {
        showError("Please enter a radius greater than 0.");
        return;
      }

      if (isNaN(movement) || movement < 0) {
        showError("Please enter a valid positive movement.");
        return;
      }

      if (movement > 2 * radius) {
        showError(
          "The movement is too large for the selected radius. It must be less than or equal to 2r."
        );
        return;
      }

      const thetaRad = 2 * Math.asin(movement / (2 * radius));
      const degrees = thetaRad * 180 / Math.PI;
      const mrad = thetaRad * 1000;

      document.getElementById("degrees").innerText =
        degrees.toFixed(3) + "°";

      document.getElementById("mrad").innerText =
        mrad.toFixed(3) + " mrad";
    }

    function formatMovement(value) {
      // Keep up to 3 digits after the decimal point,
      // but remove unnecessary trailing zeros.
      return Number(value.toFixed(3)).toString();
    }

    function clearFields() {
      document.getElementById("radius").value = "100";
      document.getElementById("movement").value = "";
      document.getElementById("reading1").value = "";
      document.getElementById("reading2").value = "";

      clearResults();
      clearError();
    }

    function clearResults() {
      document.getElementById("degrees").innerText = "";
      document.getElementById("mrad").innerText = "";
    }

    function clearError() {
      const errorBox = document.getElementById("error");
      errorBox.innerText = "";
      errorBox.style.display = "none";
    }

    function showError(message) {
      const errorBox = document.getElementById("error");

      errorBox.innerText = message;
      errorBox.style.display = "block";

      clearResults();
    }

    // Calculate immediately on page load
    // if enough values already exist.
    recalculate();
  </script>
</body>
</html>
