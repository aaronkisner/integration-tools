<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proportion Calculator</title>
  <style>
    :root{--blue:#1976d2;--blue-dark:#12305a;--border:#c5ccd6;--result-border:#9fc5ff;--bg:#f3f3f3;--text:#222}
    body{font-family:Arial,sans-serif;margin:0;padding:18px;background:var(--bg);color:var(--text)}
    .container{max-width:560px;margin:0 auto;background:white;padding:24px;border-radius:22px;box-shadow:0 4px 18px rgba(0,0,0,.16)}
    h1{font-size:30px;margin:0 0 28px;text-align:center;color:var(--blue-dark);font-weight:800}
    .section-title{display:flex;align-items:center;gap:14px;margin:26px 0 16px;color:var(--blue);font-size:22px;font-weight:bold;text-align:center}
    .section-title::before,.section-title::after{content:"";flex:1;height:1px;background:#c8ced8}
    .equation-row{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end}
    .field-block{min-width:0}
    label{display:block;margin-bottom:8px;font-size:18px;font-weight:500;text-align:left}
    .equals{min-width:34px;padding-bottom:17px;text-align:center;font-size:28px;font-weight:bold;color:var(--blue-dark)}
    input,.result-field{width:100%;box-sizing:border-box;min-height:58px;padding:12px 14px;font-size:23px;border:1.5px solid var(--border);border-radius:10px;background:white;color:#222;text-align:left}
    input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(25,118,210,.14)}
    .result-field{border-color:var(--result-border);background:#fbfdff;font-weight:bold;color:#1b1b1b}
    .formula-box{margin-top:14px;padding:14px;border-radius:10px;background:#eef6ff;text-align:center;font-size:19px;color:var(--blue-dark);min-height:24px}
    button{margin-top:24px;width:100%;padding:15px;font-size:21px;font-weight:bold;border-radius:10px;cursor:pointer;background:#f5f5f5;color:#222;border:1px solid #c6c6c6}
    .error{margin-top:18px;padding:12px;background:#ffe5e5;color:#9b0000;border-radius:10px;font-size:17px;display:none}
    .footer-banner{margin-top:32px;padding-top:16px;border-top:1px solid #d9d9d9;display:flex;justify-content:center;align-items:center;gap:12px;font-size:22px;font-weight:bold;color:var(--blue-dark);text-align:center;direction:rtl}
    .cannon{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
    .cannon svg{width:42px;height:42px;stroke:var(--blue-dark);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    @media(max-width:420px){body{padding:10px}.container{padding:20px;border-radius:18px}h1{font-size:25px}.equation-row{gap:8px}label{font-size:15px}input,.result-field{font-size:20px;padding:12px 10px}.equals{min-width:24px;font-size:24px}.formula-box{font-size:17px}.footer-banner{font-size:19px}}
  </style>
</head>
<body>
  <div class="container">
    <h1>Proportion Calculator</h1>

    <div class="section-title">Known Values</div>

    <div class="equation-row">
      <div class="field-block">
        <label for="knownX">Known X</label>
        <input id="knownX" type="number" step="any" inputmode="decimal" />
      </div>
      <div class="equals">=</div>
      <div class="field-block">
        <label for="knownY">Known Y</label>
        <input id="knownY" type="number" step="any" inputmode="decimal" />
      </div>
    </div>

    <div class="section-title">New Value</div>

    <div class="equation-row">
      <div class="field-block">
        <label for="newX">New X</label>
        <input id="newX" type="number" step="any" inputmode="decimal" />
      </div>
      <div class="equals">=</div>
      <div class="field-block">
        <label>Result</label>
        <div id="result" class="result-field"></div>
      </div>
    </div>

    <div id="formula" class="formula-box"></div>
    <div id="error" class="error"></div>

    <button onclick="clearAll()">Clear</button>

    <div class="footer-banner">
      <span class="cannon" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <path d="M14 42h28"/><path d="M25 42l-8 10"/><path d="M42 42l8 10"/>
          <circle cx="20" cy="52" r="6"/><circle cx="46" cy="52" r="6"/>
          <path d="M28 26l24-8c3-1 6 1 7 4s-1 6-4 7l-24 8z"/>
          <path d="M25 27l7 12"/><path d="M12 39c7-6 12-10 18-12"/><path d="M8 46c5-2 9-3 14-4"/>
        </svg>
      </span>
      <span>תותחים יש רק באינטגרציה</span>
    </div>
  </div>

  <script>
    const knownX=document.getElementById('knownX');
    const knownY=document.getElementById('knownY');
    const newX=document.getElementById('newX');
    [knownX,knownY,newX].forEach(field=>field.addEventListener('input',calculate));

    function formatNumber(value){
      return Number.isInteger(value)?value.toString():parseFloat(value.toFixed(3)).toString();
    }

    function calculate(){
      const knownXText=knownX.value;
      const knownYText=knownY.value;
      const newXText=newX.value;
      const resultBox=document.getElementById('result');
      const formulaBox=document.getElementById('formula');
      const errorBox=document.getElementById('error');

      errorBox.style.display='none';
      errorBox.innerText='';

      if(knownXText===''||knownYText===''||newXText===''){
        resultBox.innerText='';
        formulaBox.innerText='';
        return;
      }

      const x1=Number(knownXText),y1=Number(knownYText),x2=Number(newXText);
      if([x1,y1,x2].some(Number.isNaN)){
        resultBox.innerText='';
        formulaBox.innerText='';
        return;
      }

      if(x1===0){
        resultBox.innerText='';
        formulaBox.innerText='';
        errorBox.innerText='Known X cannot be 0.';
        errorBox.style.display='block';
        return;
      }

      const result=x2*y1/x1;
      resultBox.innerText=formatNumber(result);
      formulaBox.innerText=`${formatNumber(x2)} × ${formatNumber(y1)} ÷ ${formatNumber(x1)} = ${formatNumber(result)}`;
    }

    function clearAll(){
      knownX.value='';knownY.value='';newX.value='';
      document.getElementById('result').innerText='';
      document.getElementById('formula').innerText='';
      document.getElementById('error').style.display='none';
      knownX.focus();
    }
  </script>
</body>
</html>
