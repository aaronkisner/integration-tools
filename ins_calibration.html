<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>בדיקת קואורדינטות INS</title><style>:root{font-family:Arial,sans-serif;color:#17263d;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:18px}.wrap{max-width:650px;margin:auto}h1{text-align:center;font-size:25px}section{background:white;padding:20px;border-radius:16px;margin:15px 0;box-shadow:0 3px 15px #20344a13}h2{font-size:19px;margin:0 0 15px}label{display:block;font-weight:600;margin:13px 0 6px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}input{width:100%;padding:12px;border:1px solid #bac6d7;border-radius:9px;font-size:19px;direction:ltr;text-align:left;font-variant-numeric:tabular-nums}input:focus{outline:2px solid #4d89e5}.bounds{background:#edf3fb;border-radius:10px;padding:12px;margin-top:12px;line-height:1.9}.num{direction:ltr;display:inline-block;font-variant-numeric:tabular-nums;font-weight:bold}.result{padding:13px;border-radius:10px;margin-top:12px;background:#eef2f6}.good{background:#dff6e8;color:#126638}.bad{background:#ffe4e4;color:#a52222}.muted{color:#64748b;font-size:14px}.delta{font-size:22px;font-weight:bold;direction:ltr;display:inline-block}button{border:0;border-radius:9px;background:#e8edf5;padding:10px 18px;cursor:pointer;font-size:15px} .status{font-weight:bold} @media(max-width:450px){section{padding:10px}}body{padding:8px}.wrap{max-width:650px}h1{font-size:20px;margin:4px 0 8px}section{padding:11px;margin:8px 0;border-radius:11px}h2{font-size:16px;margin:0 0 6px}label{font-size:13px;margin:5px 0 3px}.row{gap:8px;direction:ltr}.row>div{min-width:0}input{padding:8px 6px;font-size:clamp(13px,3.7vw,18px);border-radius:7px}.bounds{padding:7px 5px;margin-top:7px;line-height:1.6;font-size:clamp(11px,3vw,14px);direction:rtl}.bounds .num{font-size:clamp(13px,3.7vw,18px)}#tol{width:125px;max-width:45%;font-size:15px;padding:6px} .muted{font-size:12px;margin:6px 0}.result{padding:8px 6px;margin-top:7px;font-size:13px}.delta{font-size:clamp(14px,4vw,20px)}#results .result:nth-child(-n+2){width:calc(50% - 4px);display:inline-block;vertical-align:top;min-height:66px}#results .result:nth-child(1){margin-right:8px}#results{direction:ltr}#results .result{direction:rtl}button{padding:7px 12px;font-size:13px;margin-top:7px}@media(max-width:450px){section{padding:10px}}@media(max-height:750px){body{padding:5px}h1{margin:2px 0 5px}section{margin:5px 0;padding:8px}.bounds{margin-top:5px}.result{margin-top:5px}} </style></head><body><main class="wrap"><h1>בדיקת קואורדינטות INS</h1><section><h2>ערכי ייחוס נדרשים</h2><div class="row"><div><label for="refLat">Latitude</label><input id="refLat" inputmode="decimal" value="32.6710809"></div><div><label for="refLon">Longitude</label><input id="refLon" inputmode="decimal" value="35.1050607"></div></div><label for="tol">סטייה מותרת (±)</label><input id="tol" inputmode="decimal" value="0.00009"><div class="row"><div class="bounds"><b>Latitude</b><br>מינימום: <span class="num" id="latMin"></span><br>מקסימום: <span class="num" id="latMax"></span></div><div class="bounds"><b>Longitude</b><br>מינימום: <span class="num" id="lonMin"></span><br>מקסימום: <span class="num" id="lonMax"></span></div></div></section><section><h2>ערכים שהתקבלו במדידה</h2><div class="row"><div><label for="lat">Latitude</label><input id="lat" inputmode="decimal" autocomplete="off" placeholder="הכנס ערך"></div><div><label for="lon">Longitude</label><input id="lon" inputmode="decimal" autocomplete="off" placeholder="הכנס ערך"></div></div><div id="results" aria-live="polite"></div><button id="clear">נקה מדידות</button></section></main><script>const $=id=>document.getElementById(id);const ids=['refLat','refLon','tol','lat','lon'];ids.forEach(id=>$(id).addEventListener('input',update));$('clear').addEventListener('click',()=>{$('lat').value='';$('lon').value='';update();$('lat').focus()});function valid(s){return /^[-+]?\d+\.\d{5,}$/.test(s.trim())}function fmt(n){return n.toFixed(7)}function update(){const a=Number($('refLat').value),b=Number($('refLon').value),t=Number($('tol').value);const refsValid=['refLat','refLon','tol'].every(id=>$(id).value.trim()!==''&&Number.isFinite(Number($(id).value)))&&t>=0;for(const [prefix,ref] of [['lat',a],['lon',b]]){$(prefix+'Min').textContent=refsValid?fmt(ref-t):'—';$(prefix+'Max').textContent=refsValid?fmt(ref+t):'—'}const x=$('lat').value.trim(),y=$('lon').value.trim();if(!refsValid){$('results').innerHTML='<div class="result bad">יש להזין ערכי ייחוס וסטייה תקינים.</div>';return}function card(name,value,ref){if(!valid(value))return '';const d=Number(value)-ref,ok=Math.abs(d)<=t+1e-12;return `<div class="result ${ok?'good':'bad'}"><b>${name}</b> — <span class="status">${ok?'✓ תקין':'✗ מחוץ לטווח'}</span><br>דלתא: <span class="delta">${d>=0?'+':'−'}${Math.abs(d).toFixed(7)}</span></div>`} $('results').innerHTML=card('Latitude',x,a)+card('Longitude',y,b);}update();</script></body></html>
