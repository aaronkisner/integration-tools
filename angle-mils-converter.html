<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angle Converter</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f3f3;margin:0;padding:18px}
.card{max-width:520px;margin:auto;background:#fff;padding:24px;border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
h1{text-align:center;color:#12305a;margin:0 0 24px}
label{display:block;margin:18px 0 6px;font-size:18px}
input{width:100%;box-sizing:border-box;padding:14px;font-size:22px;border:1.5px solid #c5ccd6;border-radius:10px}
input.active{border-color:#1976d2;box-shadow:0 0 0 2px rgba(25,118,210,.15)}
button{margin-top:24px;width:100%;padding:14px;font-size:20px;border:none;border-radius:10px;background:#1976d2;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h1>Angle Converter</h1>

<label>Degrees [°]</label>
<input id="deg" type="number" step="any">

<label>6400 mil</label>
<input id="mil6400" type="number" step="any">

<label>6000 mil (Soviet)</label>
<input id="mil6000" type="number" step="any">

<label>Milliradians (mrad)</label>
<input id="mrad" type="number" step="any">

<button onclick="clearAll()">Clear</button>
</div>

<script>
const PI=Math.PI;
let updating=false;
const ids=["deg","mil6400","mil6000","mrad"];

ids.forEach(id=>{
 const e=document.getElementById(id);
 e.addEventListener("input",()=>convert(id));
 e.addEventListener("focus",()=>{
   ids.forEach(i=>document.getElementById(i).classList.remove("active"));
   e.classList.add("active");
 });
});

function fmt(x){return (Math.round(x*1000)/1000).toFixed(3);}

function clearAll(){
 updating=true;
 ids.forEach(i=>{
   document.getElementById(i).value="";
   document.getElementById(i).classList.remove("active");
 });
 updating=false;
}

function convert(src){
 if(updating) return;

 const t=document.getElementById(src).value;

 if(t===""){
   clearAll();
   return;
 }

 const v=parseFloat(t);
 if(isNaN(v)) return;

 updating=true;
 let deg;

 switch(src){
   case "deg": deg=v; break;
   case "mil6400": deg=v*360/6400; break;
   case "mil6000": deg=v*360/6000; break;
   case "mrad": deg=v*180/(PI*1000); break;
 }

 if(src!=="deg") document.getElementById("deg").value=fmt(deg);
 if(src!=="mil6400") document.getElementById("mil6400").value=fmt(deg*6400/360);
 if(src!=="mil6000") document.getElementById("mil6000").value=fmt(deg*6000/360);
 if(src!=="mrad") document.getElementById("mrad").value=fmt(deg*PI*1000/180);

 updating=false;
}
</script>
</body>
</html>
